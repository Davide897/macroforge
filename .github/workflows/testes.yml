# Só corre testes: não publica, não faz deploy e não usa segredos.
# Os testes contra o Supabase de produção (tests/live/) ficam de fora de propósito: só à mão, com autorização.
name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Unitários (fusão da sincronização, diário)
        run: npm run test:unit
      - name: Servidor local (serve.py)
        run: npm run test:serve
      - name: App real no Chrome com Supabase falso
        run: npm run test:e2e
